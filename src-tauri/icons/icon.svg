<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f28c38;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ea6d1f;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f28c38;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- Terminal bracket: > -->
  <path d="M 120 170 L 230 256 L 120 342" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor/underscore -->
  <rect x="260" y="316" width="140" height="30" rx="15" fill="url(#accent)"/>

  <!-- Sparkle dots -->
  <circle cx="370" cy="170" r="8" fill="#e94560" opacity="0.8"/>
  <circle cx="400" cy="200" r="5" fill="#f28c38" opacity="0.6"/>
  <circle cx="350" cy="145" r="4" fill="#ea6d1f" opacity="0.5"/>
</svg>
